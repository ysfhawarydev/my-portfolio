name: Portfolio quality
on:
  pull_request:
  push:
    branches: [feat/editorial-portfolio]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve verified stable Next.js patch
        run: |
          cp package-lock.json /tmp/portfolio-lock-before.json
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.6 eslint-config-next@16.4.6
          node tests/lock-diff.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: |
          node tests/serve.mjs > /tmp/portfolio-server.log 2>&1 &
          TEST_BASE_URL=http://127.0.0.1:3000 npm run test:e2e
      - name: Visual review samples
        if: always()
        run: node tests/visual-samples.mjs
      - name: Save QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-quality
          path: |
            reports/
            package-lock.json
          retention-days: 7
